  <header class="site-header" role="banner">
    <h1 class="title">And you get a nomination!</h1>
    <p class="subtitle" aria-live="polite">Everyone gets a nomination.</p>
  </header>

  <main class="content" role="main">
    <figure class="hero">
      <img src="./oprah_nomination.png" alt="Oprah enthusiastically pointing to the audience" class="hero-image">
      <figcaption class="visually-hidden">Oprah on stage saying: And you get a nomination!</figcaption>
    </figure>

    <div class="cta">
      <button class="nominate-btn" id="nominateBtn" aria-describedby="counterDesc">
        Get a nomination
      </button>
      <p id="counterDesc" class="counter" aria-live="polite">
        Nominations given: <span id="count">0</span>
      </p>
      <p class="hint">Press N to nominate faster</p>
    </div>

    <audio id="cheerSfx" preload="auto">
      <source src="./cheer.mp3" type="audio/mpeg">
    </audio>
  </main>

  <footer class="site-footer" role="contentinfo">
    <p class="footnote">A lighthearted tribute to an iconic moment.</p>
    <p class="slogan" aria-label="Project slogan">"A Nomination for me is a nomination for everyone!"</p>
  </footer>
